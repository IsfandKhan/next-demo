version: '3.9'
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis_demo
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgis_demo
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgis_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
